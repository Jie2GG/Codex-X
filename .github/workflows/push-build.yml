name: Push build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-build
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare rolling prerelease
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read project version
        id: meta
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or reset the rolling prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="continuous"
          body="每次推送到 main 自动编译的最新开发版（pre-release，会被后续构建覆盖）。

          - 版本: ${VERSION}
          - 提交: ${COMMIT_SHA}
          - 构建时间: $(date -u '+%Y-%m-%d %H:%M UTC')

          注意: 这些构建未做 Apple 代码签名/公证，也没有 Tauri updater 签名；首次打开 macOS 应用可能需要右键选择打开。"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease --title "Codex-X continuous build" --notes "$body"
          else
            gh release create "$tag" \
              --prerelease \
              --title "Codex-X continuous build" \
              --notes "$body" \
              --target "$(git rev-parse HEAD)"
          fi

          release_id=""
          for attempt in {1..10}; do
            release_id=$(gh release view "$tag" --json databaseId --jq '.databaseId' 2>/dev/null || true)
            [ -z "$release_id" ] || break
            sleep 2
          done
          if [ -z "$release_id" ]; then
            echo "Unable to locate prerelease ${tag}" >&2
            exit 1
          fi

          gh api "/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[].id' | while read -r asset_id; do
              [ -z "$asset_id" ] || gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            bundles: app,dmg
          - name: Linux x64
            platform: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: Windows x64
            platform: windows-latest
            bundles: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts for unsigned CI builds
        run: |
          set -euo pipefail
          cat > apps/desktop/tauri.continuous.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON

      - name: Build and upload to the rolling prerelease
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: continuous
          projectPath: apps/desktop
          args: --config tauri.continuous.json --bundles ${{ matrix.bundles }}
          retryAttempts: 3
